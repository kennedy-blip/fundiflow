name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundiflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FundiFlow APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JavaScript dependencies
        run: |
          npm cache clean --force
          npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Verify web output
        run: test -s dist/index.html

      - name: Generate a fresh Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build clean debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload FundiFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: FundiFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
